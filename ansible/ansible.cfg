[defaults]
inventory = inventory.ini
# The community.general.yaml callback was removed in v12, this is its
# replacement in ansible-core.
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
# accept-new trusts the key on first contact but still refuses a key that
# changed later, unlike host_key_checking = False which never checks at all.
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s
